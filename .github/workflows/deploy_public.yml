name: deploy_public

on:
  workflow_run:
    workflows:
      - pipeline_artifacts
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: print system info
        run: |
          set -eo pipefail
          docker info
          docker image ls
          docker ps
          df -h
          id

      - name: docker compose build
        run: |
          set -eo pipefail
          export BUILDKIT_PROGRESS=plain
          docker compose build server --build-arg UID=$(id -u) --build-arg GID=$(id -g)

      - name: bash scripts/validate_atom_xml.sh
        run: |
          set -eo pipefail
          bash scripts/validate_atom_xml.sh

      - name: debug
        if: failure()
        run: |
          docker ps -a | grep -v CONTAINER | cut -d' ' -f1 | xargs -I{} -r bash -c "docker container stats --no-stream {} ; docker logs {}"

      - name: force-push docs/ to code-available-feed-public main
        run: |
          set -eo pipefail
          mkdir /tmp/public-deploy
          cp -r docs /tmp/public-deploy/docs
          cd /tmp/public-deploy
          git init
          git config user.email "marcindulak@users.noreply.github.com"
          git config user.name "Marcin Dulak"
          git checkout -b main
          git add docs/
          git commit --message "Deploy docs/ from code-available-feed@${GITHUB_SHA}"
          git remote add origin \
            "https://x-access-token:${PUBLIC_REPO_WRITE_TOKEN}@github.com/marcindulak/code-available-feed-public.git"
          git push --force origin main
        env:
          PUBLIC_REPO_WRITE_TOKEN: ${{ secrets.PUBLIC_REPO_WRITE_TOKEN }}
