name: deploy_orphan

on:
  workflow_run:
    workflows:
      - pipeline_feed
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pipeline-and-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: print system info
        run: |
          set -eo pipefail
          docker info
          docker image ls
          docker ps
          df -h
          id

      - name: bash scripts/build_docker_image.sh
        run: bash scripts/build_docker_image.sh

      # NFR-007 exception (b) + (c): download the artifact produced by the
      # triggering pipeline_feed run, or (on workflow_dispatch) the
      # latest successful pipeline_feed run. The if: conditional and
      # the gh-CLI shell are inline because they depend on workflow event
      # state that has no local equivalent.
      - name: download arxiv-feeds artifact (from triggering pipeline_feed run)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v7
        with:
          name: arxiv-feeds
          path: docs/arxiv/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: download arxiv-feeds artifact (latest, for workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow pipeline_feed.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name arxiv-feeds \
            --dir docs/arxiv/

      # TODO(FR-010): bash scripts/validate_atom_xml.sh goes here once that
      # script is updated to the correct feed path docs/arxiv/{category}/atom.xml.

      - name: git config --global user
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"

      - name: bash scripts/deploy_orphan.sh
        run: bash scripts/deploy_orphan.sh
        env:
          ARXIV_CATEGORY_ID: ${{ vars.ARXIV_CATEGORY_ID || 'cs.AI' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: debug
        if: failure()
        run: |
          docker ps -a | grep -v CONTAINER | cut -d' ' -f1 | xargs -I{} -r bash -c "docker container stats --no-stream {} ; docker logs {}"
