name: deploy_orphan

on:
  workflow_run:
    workflows:
      - pipeline_feed
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pipeline-and-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: print system info
        run: |
          set -eo pipefail
          docker info
          docker image ls
          docker ps
          df -h
          id

      - name: bash scripts/build_docker_image.sh
        timeout-minutes: 10
        run: bash scripts/build_docker_image.sh

      - name: download arxiv-feed artifact (from triggering pipeline_feed run)
        timeout-minutes: 10
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v7
        with:
          name: arxiv-feed
          path: docs/arxiv/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: download arxiv-feed artifact (latest, for workflow_dispatch)
        timeout-minutes: 10
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow pipeline_feed.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name arxiv-feed \
            --dir docs/arxiv/

      - name: git config --global user
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"

      - name: bash scripts/deploy_orphan.sh
        timeout-minutes: 10
        run: bash scripts/deploy_orphan.sh
        env:
          ARXIV_CATEGORY_ID: ${{ vars.ARXIV_CATEGORY_ID || 'cs.AI' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: debug
        if: failure()
        run: |
          docker ps -a | grep -v CONTAINER | cut -d' ' -f1 | xargs -I{} -r bash -c "docker container stats --no-stream {} ; docker logs {}"
