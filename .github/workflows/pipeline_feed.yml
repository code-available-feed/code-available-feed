name: pipeline_feed

on:
  schedule:
    - cron: '0 02 * * *' # Daily at 02:00 UTC
    - cron: '0 10 * * *' # Daily at 10:00 UTC
    - cron: '0 20 * * *' # Daily at 20:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: pipeline-and-deploy
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: print system info
        run: |
          set -eo pipefail
          docker info
          docker image ls
          docker ps
          df -h
          id

      - name: bash scripts/build_docker_image.sh
        timeout-minutes: 10
        run: bash scripts/build_docker_image.sh

      - name: bash scripts/test_e2e_behave.sh
        timeout-minutes: 20
        run: bash scripts/test_e2e_behave.sh

      - name: debug
        if: failure()
        run: |
          docker ps -a | grep -v CONTAINER | cut -d' ' -f1 | xargs -I{} -r bash -c "docker container stats --no-stream {} ; docker logs {}"

      # NFR-007 exception (a): restoring repository branch state via
      # `git fetch` + `git checkout` of another branch into the workflow
      # checkout. This has no local equivalent because it operates on the
      # workflow's pre-checked-out repository.
      - name: restore docs/ from gh-pages branch
        run: |
          git fetch origin gh-pages 2>/dev/null \
            && git checkout origin/gh-pages -- docs/ 2>/dev/null \
            || echo "No gh-pages branch yet, starting fresh"

      - name: bash scripts/pipeline_feed.sh
        timeout-minutes: 20
        run: bash scripts/pipeline_feed.sh
        env:
          ARXIV_CATEGORY_ID: ${{ vars.ARXIV_CATEGORY_ID || 'cs.AI' }}
          ARXIV_CATEGORY_STRICT: ${{ vars.ARXIV_CATEGORY_STRICT || 'false' }}
          ARXIV_CONTINUE_ON_API_ERROR: ${{ vars.ARXIV_CONTINUE_ON_API_ERROR || 'true' }}

      - name: debug
        if: failure()
        run: |
          docker ps -a | grep -v CONTAINER | cut -d' ' -f1 | xargs -I{} -r bash -c "docker container stats --no-stream {} ; docker logs {}"

      - name: bash scripts/check_feed_staleness.sh
        timeout-minutes: 5
        run: bash scripts/check_feed_staleness.sh
        env:
          ARXIV_CATEGORY_ID: ${{ vars.ARXIV_CATEGORY_ID || 'cs.AI' }}
          ARXIV_MAX_STALENESS_DAYS: ${{ vars.ARXIV_MAX_STALENESS_DAYS || '5' }}

      - name: debug
        if: failure()
        run: |
          docker ps -a | grep -v CONTAINER | cut -d' ' -f1 | xargs -I{} -r bash -c "docker container stats --no-stream {} ; docker logs {}"

      - name: upload arxiv-feed artifact
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: arxiv-feed
          path: docs/arxiv/
          retention-days: 7
